# ============================================================================
#  COMPONENT SIDECAR  —  Envoy proxy that rides next to your Python app
#  Inbound:   mTLS from the gateway -> re-validate JWT (VRE) -> only allowed routes -> localhost app
#  Outbound:  app calls localhost -> sidecar adds mTLS -> corporate backend (egress)
# ============================================================================
static_resources:

  listeners:

  # --------------------------------------------------------------------------
  # INGRESS  (port 9443) : traffic arriving from the gateway
  # --------------------------------------------------------------------------
  - name: ingress
    address:
      socket_address: { address: 0.0.0.0, port_value: 9443 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          # ---- enable WebSocket upgrades (chatbot streams) ----
          upgrade_configs:
          - upgrade_type: websocket
          stream_idle_timeout: 0s
          route_config:
            name: local_routes
            virtual_hosts:
            - name: app
              domains: ["*"]
              # ---- ROUTE ALLOW-LIST: only these paths reach the app. NO bare "/" ----
              routes:
              # WebSocket chat endpoint — long-lived, JWT still checked at the handshake
              - match: { prefix: "/v1/chat" }
                route:
                  cluster: local_app
                  timeout: 0s
                  upgrade_configs:
                  - upgrade_type: websocket
              - match: { path: "/v1/predict" }
                route: { cluster: local_app }
              - match: { path: "/v1/embeddings" }
                route: { cluster: local_app }
              - match: { path: "/v1/health" }
                route: { cluster: local_app }
              # everything else (including "/") is explicitly refused:
              - match: { prefix: "/" }
                direct_response: { status: 403, body: { inline_string: "forbidden" } }

          http_filters:
          # ---- VRE: re-validate the JWT independently of the gateway ----
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                corporate_idp:
                  issuer: "https://idp.corp.example.com"
                  audiences: ["ai-platform"]
                  forward: true
                  forward_payload_header: "x-jwt-claims"   # app can read identity from this header
                  remote_jwks:
                    http_uri:
                      uri: "https://idp.corp.example.com/.well-known/jwks.json"
                      cluster: jwks_cluster
                      timeout: 5s
                    cache_duration: 600s
              rules:
              - match: { prefix: "/v1/" }
                requires: { provider_name: corporate_idp }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      # ---- DOWNSTREAM mTLS: only the gateway (trusted by mesh CA) may connect ----
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          require_client_certificate: true
          common_tls_context:
            tls_certificates:
            - certificate_chain: { filename: "/etc/certs/component.crt" }
              private_key:       { filename: "/etc/certs/component.key" }
            validation_context:
              trusted_ca: { filename: "/etc/certs/mesh-ca.crt" }

  # --------------------------------------------------------------------------
  # EGRESS  (port 15001) : the app sends outbound backend calls here on localhost
  # In Python:  requests.post("http://localhost:15001/...")
  # --------------------------------------------------------------------------
  - name: egress
    address:
      socket_address: { address: 127.0.0.1, port_value: 15001 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          route_config:
            name: egress_routes
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: corporate_backend }   # only this approved destination
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:

  # local Python app — plain HTTP on localhost (no TLS needed inside the pod)
  - name: local_app
    type: STATIC
    load_assignment:
      cluster_name: local_app
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8080 }

  # corporate backend — sidecar adds mTLS on the way out
  - name: corporate_backend
    type: STRICT_DNS
    load_assignment:
      cluster_name: corporate_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: api.backend.corp.example.com, port_value: 443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          tls_certificates:                              # component proves its identity to the backend
          - certificate_chain: { filename: "/etc/certs/component.crt" }
            private_key:       { filename: "/etc/certs/component.key" }
          validation_context:
            trusted_ca: { filename: "/etc/certs/corp-ca.crt" }

  - name: jwks_cluster
    type: STRICT_DNS
    load_assignment:
      cluster_name: jwks_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: idp.corp.example.com, port_value: 443 }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
